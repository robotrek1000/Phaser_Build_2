<!doctype html>

<html lang="ru">
    <head>
        <meta charset="UTF-8"/>

        <link rel="icon" type="image/png" href="/favicon.png"/>

        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <link
            rel="preload"
            href="/fonts/jaro-cyrillic.otf"
            as="font"
            type="font/otf"
            crossorigin
        />

        <title><%= APP_NAME %></title>

        <style>
          :root {
            --app-height: 100vh;
            --design-width: <%= DESIGN_WIDTH %>px;
            --design-height: <%= DESIGN_HEIGHT %>px;
            --game-rem: 16px;
          }

          body {
            background: #0a4261;
          }
        </style>
    </head>
    <body>
        <div id="app-splash-screen" style="position: fixed; inset: 0;">
            <div style="
                    position: absolute;
                    width: min(
                        100vw,
                        calc(var(--app-height) * var(--design-width) / var(--design-height))
                    );
                    height: min(
                        var(--app-height),
                        calc(100vw * var(--design-height) / var(--design-width))
                    );
                    aspect-ratio: var(--design-width) / var(--design-height);
                    left: 50%;
                    top: 50%;
                    transform: translate(-50%, -50%);"
            >
                <img
                    src="/assets/load_screen.png"
                    alt="<%= APP_NAME %>"
                    style="width: 100%; height: 100%; object-fit: cover"
                    fetchpriority="high"
                    decoding="async"
                />
            </div>
        </div>

        <div id="root"></div>

        <script type="module" src="/src/init.ts"></script>

        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
